<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account · Bookroom</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><main class="auth-card"><div class="brand">Bookroom Library</div><h1>Join the library</h1><p class="subtle">Create an account to explore the collection.</p><form id="signup-form"><div class="form-group"><label for="name">Full name</label><input id="name" type="text" autocomplete="name" required></div><div class="form-group"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="form-group"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="6" required></div><div id="message" class="message" role="alert"></div><button class="button" type="submit">Create account</button></form><p class="switch">Already a member? <a href="login.html">Sign in</a></p></main><script src="signup.js"></script></body></html>
